<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>记账小账本</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <header>
    <h1>💰 记账小账本</h1>
    <span class="sub" id="today"></span>
  </header>

  <div class="keybar">
    <span class="klabel">🔑 我的账本密钥</span>
    <code id="keyText">--------</code>
    <button class="kbtn" onclick="copyKey()">复制</button>
    <button class="kbtn" onclick="switchKey()">切换 / 导入</button>
    <span style="flex:1"></span>
    <button class="kbtn" onclick="exportData()">导出备份</button>
    <button class="kbtn" onclick="importData()">导入备份</button>
  </div>

  <section class="summary">
    <div class="card"><div class="label">本月收入</div><div class="val income" id="sumIncome">¥0.00</div></div>
    <div class="card"><div class="label">本月支出</div><div class="val expense" id="sumExpense">¥0.00</div></div>
    <div class="card"><div class="label">本月结余</div><div class="val" id="sumBalance">¥0.00</div></div>
  </section>

  <section class="panel">
    <h2>✍️ 记一笔</h2>
    <div class="type-toggle">
      <button id="btnExpense" class="on-expense" onclick="setType('expense')">支出</button>
      <button id="btnIncome" onclick="setType('income')">收入</button>
    </div>
    <div class="row">
      <div class="field amount-field">
        <label>金额</label>
        <input id="amount" type="number" inputmode="decimal" placeholder="0.00" step="0.01" min="0" />
      </div>
      <div class="field">
        <label>分类</label>
        <select id="category"></select>
      </div>
    </div>
    <div class="row" style="margin-top:10px;">
      <div class="field"><label>日期</label><input id="date" type="date" /></div>
      <div class="field"><label>备注</label><input id="note" type="text" placeholder="选填，例如：午饭" maxlength="40" /></div>
    </div>
    <button class="add-btn" onclick="addRecord()">+ 添加记录</button>
  </section>

  <section class="panel">
    <h2>📊 汇总分析</h2>
    <div class="stat-row">
      <div class="s"><div class="l">累计收入</div><div class="v income" id="allIncome">¥0.00</div></div>
      <div class="s"><div class="l">累计支出</div><div class="v expense" id="allExpense">¥0.00</div></div>
      <div class="s"><div class="l">累计结余</div><div class="v" id="allBalance">¥0.00</div></div>
    </div>
    <div class="chart-grid">
      <div class="chart-box">
        <div class="t">支出分类占比</div>
        <div id="pieWrap"></div>
        <div class="legend" id="pieLegend"></div>
      </div>
      <div class="chart-box">
        <div class="t">分类支出排行</div>
        <div id="rankWrap"></div>
      </div>
      <div class="chart-box full">
        <div class="t">收支趋势（近 12 个月）</div>
        <div id="trendWrap"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <select id="filterMonth" onchange="render()"></select>
      <select id="filterCategory" onchange="render()"><option value="">全部分类</option></select>
      <span class="count" id="count"></span>
    </div>
    <div class="list" id="list"></div>
  </section>

  <div class="footer-note">
    数据保存在当前浏览器的本地存储中，无需登录、纯前端运行。<br/>
    建议定期点「导出备份」保存 JSON 文件；清缓存或换设备后，用「导入备份」即可恢复账本。
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
